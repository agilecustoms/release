name: 'Consistent Release'
author: 'Alexey Chekulaev'
description: 'Secure, repeatable releases to AWS and npm with semantic versioning, self-service releases and multi‑artifact support'
branding:
  icon: package
  color: green
inputs:
  aws-account:
    description: 'AWS account to publish artifacts to. Not needed if there are no artifacts, just git tag'
    required: false
  aws-codeartifact-domain:
    description: 'CodeArtifact domain name, e.g., `mycompany`'
    required: false
  aws-codeartifact-maven:
    description: 'Two possible values: build and publish. publish - publish maven artifacts to AWS CodeArtifact, build - just access CodeArtifact to update version in pom.xml'
    required: false
  aws-codeartifact-repository:
    description: 'CodeArtifact repository name, e.g., `maven`'
    required: false
    default: 'maven'
  aws-ecr:
    description: 'If true, then push docker image to ECR'
    required: false
  aws-region:
    description: 'AWS region'
    required: false
  aws-role:
    description: 'IAM role to assume to publish, e.g., `ci/publisher`'
    required: false
  aws-s3-bucket:
    description: 'Required if uploading to S3 (i.e. s3/ directory exists)'
    required: false
  aws-s3-dir:
    description: 'Allows you to specify S3 bucket directory to upload artifacts to. By default, just place in `bucket/{repo-name}/{version}/*`'
    required: false
  changelog-file:
    description: 'Changelog file path. Pass empty string to disable changelog generation'
    required: false
    default: 'CHANGELOG.md'
  changelog-title:
    description: 'Title of the changelog file (first line of the file)'
    required: false
    default: '# Changelog'
  dev-branch-prefix:
    description: 'Allows you to enforce branch prefix for dev-releases; this helps to write auto-disposal rules. Empty string disables enforcement'
    required: false
    default: 'feature/'
  dev-release:
    description: 'Allows you to create a temporary named release, mainly for dev testing. Implementation is different for all supported artifact types'
    required: false
    default: 'false'
  floating-tags:
    description: 'When the next version to be released is 1.2.4, then also release 1, 1.2, and latest. Not desired for public terraform modules'
    required: false
    default: 'true'
  gcp-artifact-repository:
    description: 'If set, then push docker image to this Google Artifact Registry Docker repository (name), e.g. `my-repo`'
    required: false
  gcp-project:
    description: 'Google Cloud project to publish artifacts to'
    required: false
  gcp-region:
    description: 'Google Cloud region of Artifact Registry repository, e.g. `us-east1`'
    required: false
  gcp-service-account:
    description: 'Google Cloud service account (short name) in gcp-project to impersonate to publish, e.g. `ci-publisher`'
    required: false
  gcp-workload-identity-provider:
    description: 'Workload Identity Provider full name: `projects/{number}/locations/global/workloadIdentityPools/{pool}/providers/{id}`'
    required: false
  java-cache:
    description: 'Enabled by default, specify empty string to disable caching'
    required: false
    default: 'maven'
  java-cache-dependency-path:
    description: 'Files hashed into the Maven cache key, default **/pom.xml'
    required: false
  java-cache-key:
    description: 'Name of the Maven cache to restore (saved by the build job), see agilecustoms/gha-setup-java "java-cache-key"'
    required: false
    default: 'default'
  java-distribution:
    description: 'Java distribution, use Temurin as it is pre-cached in ubuntu-latest'
    required: false
    default: 'temurin'
  java-version:
    description: 'Java version to use'
    required: false
    default: '21'
  npm-publish:
    description: 'If true, then publish package to npmjs.com registry'
    required: false
    default: 'false'
  npm-visibility:
    description: 'Used together with input `npm-publish`. Specifies package visibility: public or private'
    required: false
    default: 'public'
  pre-publish-script:
    description: 'Shell script that allows you to update version in custom file(s), not only files governed by build tool (pom.xml, package.json, etc)'
    required: false
  python-version:
    description: 'Python version. Not in use right now'
    required: false
    default: '3.13'
  release-branches:
    description: 'semantic-release "branches" configuration'
    required: false
  release-channel:
    description: 'Repeat `.releaserc.json` `channel` behavior when set `version` explicitly'
    required: false
  release-gh:
    description: 'If true, then create a GitHub release with the same name as the tag'
    required: false
    default: 'true'
  release-plugins:
    description: 'semantic-release plugins configuration'
    required: false
  summary:
    description: 'Text to print in step summary. Can use `${version}` placeholder. Default is `### Released ${version}`. Set empty string to omit summary generation'
    required: false
    default: '### Released ${version}'
  tag-format:
    description: 'Git tag format, by default `v${version}` (git tag `v1.0.0`). Applies only to git tags, version itself (manifests, S3 path, Docker tag) is always bare `1.0.0`'
    required: false
  update-version-in-manifest:
    description: 'Update version in language-specific manifest files (e.g., pom.xml, package.json, pyproject.toml)'
    required: false
    default: 'true'
  version:
    description: 'Explicit version to use instead of auto-generation'
    required: false
  version-bump:
    description: 'Allows you to bump a version without conventional commits'
    required: false

runs:
  using: "composite"
  steps:

## Phase 1.1 - Validate event trigger

    - name: Validate trigger event
      shell: bash
      run: |
        # Validate trigger event
        if [[ "${{ github.event_name }}" == "pull_request" || "${{ github.event_name }}" == "pull_request_target" ]]; then
          echo "Error: agilecustoms/release doesn't support on: pull_request/pull_request_target as a trigger" >&2; exit 1
        fi

## Phase 1.2 - Validate secrets (tokens) passed via env variables

    - name: Validate GH token
      if: inputs.release-gh == 'true' && inputs.dev-release != 'true' && !env.GH_TOKEN
      shell: bash
      run: |
        echo "Error: env variable GH_TOKEN is required to create GH release, you can pass $ {{ github.token }} or PAT" >&2; exit 1

    - name: Validate npm visibility
      if: inputs.npm-publish == 'true' && ! (inputs.npm-visibility == 'public' || inputs.npm-visibility == 'private')
      shell: bash
      run: |
        echo "Error: npm-visibility must be either 'public' or 'private'" >&2; exit 1

## Phase 1.3 - Validate the rest of inputs, infer defaults

    - name: Init
      id: init
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        DEV_RELEASE: ${{ inputs.dev-release }}
        DEV_BRANCH_PREFIX: ${{ inputs.dev-branch-prefix }}
        AWS_ACCOUNT: ${{ inputs.aws-account }}
        AWS_REGION: ${{ inputs.aws-region }}
        AWS_ROLE: ${{ inputs.aws-role }}
        AWS_ECR: ${{ inputs.aws-ecr }}
        AWS_CODEARTIFACT_MAVEN: ${{ inputs.aws-codeartifact-maven }}
        AWS_CODEARTIFACT_DOMAIN: ${{ inputs.aws-codeartifact-domain }}
        AWS_S3_BUCKET: ${{ inputs.aws-s3-bucket }}
        GCP_ARTIFACT_REPOSITORY: ${{ inputs.gcp-artifact-repository }}
        GCP_PROJECT: ${{ inputs.gcp-project }}
        GCP_REGION: ${{ inputs.gcp-region }}
        GCP_SERVICE_ACCOUNT: ${{ inputs.gcp-service-account }}
        GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ inputs.gcp-workload-identity-provider }}
      run: bash "$GITHUB_ACTION_PATH/scripts/init.sh"

## Phase 2 - Release generation

    # the default Node is still 20, while release-gen uses Node 24 (can downgrade to 22 if needed)
    - name: Set up Node
      uses: actions/setup-node@v6
      with:
        node-version: 24

    # CWD is /home/runner/work/release/release
    # generate a new version, release notes (available in file outputs.notes_file) and also update file CHANGELOG.md
    - name: Release generation
      id: release_gen
      if: inputs.dev-release != 'true'
      uses: agilecustoms/release-gen@v5.0.0
      with:
        changelog_file: ${{ inputs.changelog-file }}
        changelog_title: ${{ inputs.changelog-title }}
        floating_tags: ${{ inputs.floating-tags }}
        release_branches: ${{ inputs.release-branches }}
        release_channel: ${{ inputs.release-channel }}
        release_plugins: ${{ inputs.release-plugins }}
        tag_format: ${{ inputs.tag-format }}
        version: ${{ inputs.version }}
        version_bump: ${{ inputs.version-bump }}

    - name: Finalize version and tags
      id: version
      shell: bash
      env:
        DEV_RELEASE: ${{ inputs.dev-release }}
        GEN_VERSION: ${{ steps.release_gen.outputs.version }}
        GEN_GIT_TAGS: ${{ steps.release_gen.outputs.git_tags }}
        GEN_TAGS: ${{ steps.release_gen.outputs.tags }}
      run: bash "$GITHUB_ACTION_PATH/scripts/version.sh"

## Phase 3.1 - Log in AWS

    - name: Log in AWS
      if: steps.init.outputs.aws_s3 || inputs.aws-ecr || inputs.aws-codeartifact-maven
      id: login-aws
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-region: ${{ inputs.aws-region }}
        output-credentials: true
        role-to-assume: arn:aws:iam::${{ inputs.aws-account }}:role/${{ inputs.aws-role }}

    - name: Log in Amazon ECR
      if: inputs.aws-ecr
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2 # outputs.registry = {acc_id}.dkr.ecr.{region}.amazonaws.com

## Phase 3.2 - Log in Google Cloud

    # GitHub OIDC token -> Workload Identity Federation -> short-lived access token of the service account (no keys)
    # caller job needs 'permissions: id-token: write', same as for AWS
    - name: Log in Google Cloud
      if: inputs.gcp-artifact-repository
      id: login-gcp
      uses: google-github-actions/auth@v3
      with:
        service_account: ${{ steps.init.outputs.gcp_service_account }}
        token_format: access_token # for 'docker login', otherwise only gcloud and client libraries can use credentials
        workload_identity_provider: ${{ inputs.gcp-workload-identity-provider }}

## Phase 4 - Prepare: mainly bump versions in language-specific files

    - name: Setup Java
      if: hashFiles('pom.xml') && inputs.dev-release != 'true'
      uses: actions/setup-java@v5
      with:
        distribution: ${{ inputs.java-distribution }}
        java-version: ${{ inputs.java-version }}

    # not setup-java's own cache: its key is an exact pom.xml hash with no fallback, and each release commit changes
    # pom versions, so it always missed and saved a new cache nobody could use. Instead restore (read-only) the cache
    # the build job saved for the same commit: key and paths must match agilecustoms/gha-setup-java exactly
    - name: Restore maven cache
      if: hashFiles('pom.xml') && inputs.dev-release != 'true' && inputs.java-cache == 'maven'
      uses: actions/cache/restore@v6
      with:
        key: maven-${{ inputs.java-cache-key }}-${{ runner.os }}-${{ hashFiles(inputs.java-cache-dependency-path || '**/pom.xml') }}
        path: |
          ~/.m2/repository
          ~/.m2/wrapper
        restore-keys: maven-${{ inputs.java-cache-key }}-${{ runner.os }}-

    - name: Setup Maven CodeArtifact
      if: inputs.aws-codeartifact-maven
      uses: agilecustoms/setup-maven-codeartifact@v2.5.0
      with:
        aws-account: ${{ inputs.aws-account }}
        aws-codeartifact-domain: ${{ inputs.aws-codeartifact-domain }}
        aws-codeartifact-repository: ${{ inputs.aws-codeartifact-repository }}
        aws-login: false # we already logged in AWS in a previous step
        aws-region: ${{ inputs.aws-region }}
        aws-role: ${{ inputs.aws-role }}
        java-setup: false

    - name: Update version in pom.xml
      if: inputs.update-version-in-manifest == 'true' && hashFiles('pom.xml') && inputs.dev-release != 'true'
      shell: bash
      run: |
        # Update version in pom.xml
        MVN=mvn
        if [[ -x ./mvnw ]]; then MVN=./mvnw; fi
        "$MVN" --no-transfer-progress versions:set -DnewVersion=${{ steps.version.outputs.version }} -DoldVersion=* -DgroupId=* -DartifactId=*
    # maven first creates effective pom, which requires resolving parent dependencies,
    # so unfortunately, even just to update versions in pom.xml, we need to have AWS CodeArtifact access :(

    - name: Update version in package.json
      if: inputs.update-version-in-manifest == 'true' && hashFiles('package.json') && inputs.dev-release != 'true'
      shell: bash
      run: |
        # Update version in package.json
        npm version ${{ steps.version.outputs.version }} --no-git-tag-version

    - name: Update version in pyproject.toml
      if: inputs.update-version-in-manifest == 'true' && hashFiles('pyproject.toml') && inputs.dev-release != 'true'
      shell: bash
      run: |
        # Update version in pyproject.toml
        sed -i 's/^version[[:space:]]*=[[:space:]]*".*"/version = "${{ steps.version.outputs.version }}"/' pyproject.toml

    - name: Install uv
      if: inputs.update-version-in-manifest == 'true' && hashFiles('uv.lock') && inputs.dev-release != 'true'
      uses: astral-sh/setup-uv@v8.1.0 # no floating tags :(

    # sadly but 'uv lock' downloads python bcz system one (installed in Ubuntu) != .python-version
    # note: Poetry doesn't track app version in its poetry.lock file, so no need to update
    - name: Update version in uv.lock
      if: inputs.update-version-in-manifest == 'true' && hashFiles('uv.lock') && inputs.dev-release != 'true'
      shell: bash
      run: |
        # Update version in uv.lock
        uv lock

    - name: Pre-publish script
      if: inputs.pre-publish-script && inputs.dev-release != 'true'
      shell: bash
      run: |
        # Pre-publish script
        version=${{ steps.version.outputs.version }} && git_tag=${{ steps.version.outputs.git_tag }} && ${{ inputs.pre-publish-script }}

## Phase 5 - Publish artifacts

    - name: Publish to S3
      if: steps.init.outputs.aws_s3
      uses: agilecustoms/publish-s3@v2.2.4
      with:
        access-key-id: ${{ steps.login-aws.outputs.aws-access-key-id }}
        aws-region: ${{ inputs.aws-region }}
        bucket: ${{ inputs.aws-s3-bucket }}
        bucket-dir: ${{ inputs.aws-s3-dir }}
        dev-release: ${{ inputs.dev-release }}
        secret-access-key: ${{ steps.login-aws.outputs.aws-secret-access-key }}
        session-token: ${{ steps.login-aws.outputs.aws-session-token }}
        versions: ${{ steps.version.outputs.tags }}

    - name: Push Docker image in ECR
      if: inputs.aws-ecr
      shell: bash
      env:
        SERVICE: ${{ steps.init.outputs.service }}
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        TAGS: ${{ steps.version.outputs.tags }}
        DEV_RELEASE: ${{ inputs.dev-release }}
      run: bash "$GITHUB_ACTION_PATH/scripts/ecr-push.sh"

    - name: Push Docker image in Google Artifact Registry
      if: inputs.gcp-artifact-repository
      shell: bash
      env:
        SERVICE: ${{ steps.init.outputs.service }}
        GCP_ARTIFACT_REGISTRY: ${{ steps.init.outputs.gcp_artifact_registry }}
        GCP_ACCESS_TOKEN: ${{ steps.login-gcp.outputs.access_token }}
        TAGS: ${{ steps.version.outputs.tags }}
      run: bash "$GITHUB_ACTION_PATH/scripts/gar-push.sh"

    # maven.main.skip=true (from Maven 3.9.0) to skip main sources compilation
    # maven.test.skip=true skips tests compilation and running (-DskipTests just skips running)
    # it does repackage though! (this is for good, bcz pom versions changed)
    # 'deploy' still runs all earlier phases (validate..verify), so skip checks that already ran in the build job:
    # checkstyle and enforcer (validate), jacoco (no execution data anyway since tests are skipped)
    - name: Publish maven to CodeArtifact
      if: inputs.aws-codeartifact-maven == 'publish' && inputs.dev-release != 'true'
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/scripts/maven-publish.sh"

    # get namespace from package.json: "name": "@company/my-package", then find mapping namespace => npm repo in .npmrc file
    # since there is no .npmrc file, do publish in npmjs.com npm registry
    - name: Publish in npmjs
      if: inputs.npm-publish == 'true' && inputs.dev-release != 'true'
      shell: bash
      env:
        NPM_VISIBILITY: ${{ inputs.npm-visibility }}
        CHANNEL: ${{ steps.release_gen.outputs.channel }}
      run: bash "$GITHUB_ACTION_PATH/scripts/npm-publish.sh"

## Phase 6 - Git push

#    - name: Error to test publish idempotency
#      shell: bash
#      run: |
#        echo "intentional error" >&2
#        exit 1

    # see script for permissions needed to push and how GH_TOKEN is applied
    - name: Git push
      if: inputs.dev-release != 'true'
      shell: bash
      env:
        CHANGELOG_FILE: ${{ inputs.changelog-file }}
        GIT_TAG: ${{ steps.version.outputs.git_tag }}
        GIT_TAGS: ${{ steps.version.outputs.git_tags }}
        VERSION: ${{ inputs.version }}
        PRERELEASE: ${{ steps.release_gen.outputs.prerelease }}
        CHANNEL: ${{ steps.release_gen.outputs.channel }}
        SERVICE: ${{ steps.init.outputs.service }}
      run: bash "$GITHUB_ACTION_PATH/scripts/git-push.sh"

## Phase 7 - GitHub Release

    # standard --generate-notes just add one line "**Full Changelog**: https://github.com/agilecustoms/{repo}/compare/v0.1.3...v0.1.4"
    - name: GitHub Release
      if: inputs.dev-release != 'true' && inputs.release-gh == 'true' && steps.release_gen.outputs.notes_tmp_file
      shell: bash
      run: |
        # GitHub Release
        gh release create ${{ steps.version.outputs.git_tag }} --notes-file ${{ steps.release_gen.outputs.notes_tmp_file }}

## Phase 8 - Print summary

    - name: Summary
      if: inputs.summary && inputs.dev-release != 'true'
      shell: bash
      # pass via env (not ${{ }} in script) and replace placeholder literally (no eval),
      # so summary text is never executed as shell code
      env:
        SUMMARY: ${{ inputs.summary }}
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        # Summary
        echo "${SUMMARY//'${version}'/$VERSION}" >> "$GITHUB_STEP_SUMMARY"

outputs:
  git-tag:
    description: "Git tag of the release: version with tag-format applied (e.g. 'v1.2.3')"
    value: ${{ steps.version.outputs.git_tag }}
  version:
    description: "Newly released version, bare (e.g. '1.2.3'), same as in manifests, S3 path and Docker tag"
    value: ${{ steps.version.outputs.version }}
