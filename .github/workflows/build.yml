name: Build

on:
  push:
    branches: [ '**' ] # not on tags: 'E2E-*' jobs need a branch (GITHUB_REF) to release from

# Safety: tests can't push anything to this repo:
# job token is read-only and checkout doesn't persist credentials. No secrets are used in tests, so they also run in forks
# - 'Input-Validation' tests must fail on input validation, before anything is released
# - 'E2E-*' tests release into a local sandbox repo (origin is a local bare repo), never to GitHub
# Only 'Release' job (main branch, after all tests pass) uses a secret: PAT to push the release commit and tags
permissions:
  contents: read

jobs:
  Input-Validation:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false


      - name: Test 1. Should fail if GH_TOKEN is not passed and release-gh is true
        id: test1
        continue-on-error: true
        uses: ./

      - name: Test 1. Verify it failed
        if: steps.test1.outcome != 'failure'
        run: |
          echo "Expected failure, got ${{ steps.test1.outcome }}"
          exit 1


      - name: Test 2. Should fail if npm-visibility is neither public nor private
        id: test2
        continue-on-error: true
        uses: ./
        with:
          release-gh: false
          npm-publish: true
          npm-visibility: internal

      - name: Test 2. Verify it failed
        if: steps.test2.outcome != 'failure'
        run: |
          echo "Expected failure, got ${{ steps.test2.outcome }}"
          exit 1


      - name: Test 3. Should fail if version is passed together with dev-release
        id: test3
        continue-on-error: true
        uses: ./
        with:
          dev-release: true
          dev-branch-prefix: ''
          version: 1.2.3

      - name: Test 3. Verify it failed
        if: steps.test3.outcome != 'failure'
        run: |
          echo "Expected failure, got ${{ steps.test3.outcome }}"
          exit 1


      # prefix that no branch has, so the test works on any branch
      - name: Test 4. Should fail if dev-release branch doesn't start with dev-branch-prefix
        id: test4
        continue-on-error: true
        uses: ./
        with:
          dev-release: true
          dev-branch-prefix: no-such-prefix/

      - name: Test 4. Verify it failed
        if: steps.test4.outcome != 'failure'
        run: |
          echo "Expected failure, got ${{ steps.test4.outcome }}"
          exit 1


      - name: Test 5. Should fail if aws-codeartifact-maven is set without aws-codeartifact-domain
        id: test5
        continue-on-error: true
        uses: ./
        with:
          release-gh: false
          aws-account: '123456789012'
          aws-region: us-east-1
          aws-role: ci/publisher
          aws-codeartifact-maven: publish

      - name: Test 5. Verify it failed
        if: steps.test5.outcome != 'failure'
        run: |
          echo "Expected failure, got ${{ steps.test5.outcome }}"
          exit 1


      # s3/ directory means "publish to S3"
      - name: Test 6. Setup s3/ directory
        run: mkdir -p s3

      - name: Test 6. Should fail if s3/ exists but aws-account, aws-region and aws-role are not passed
        id: test6
        continue-on-error: true
        uses: ./
        with:
          release-gh: false
          aws-s3-bucket: some-bucket

      - name: Test 6. Verify it failed
        if: steps.test6.outcome != 'failure'
        run: |
          echo "Expected failure, got ${{ steps.test6.outcome }}"
          exit 1


      - name: Test 7. Setup s3/ directory
        run: mkdir -p s3

      - name: Test 7. Should fail if s3/ exists but aws-s3-bucket is not passed
        id: test7
        continue-on-error: true
        uses: ./
        with:
          release-gh: false
          aws-account: '123456789012'
          aws-region: us-east-1
          aws-role: ci/publisher

      - name: Test 7. Verify it failed
        if: steps.test7.outcome != 'failure'
        run: |
          echo "Expected failure, got ${{ steps.test7.outcome }}"
          exit 1

  # Real release (version generation, changelog, manifest update, commit, tags, push) into a local sandbox repo:
  # - the action is checked out into 'action/', workspace root becomes the sandbox repo
  #   (release-gen writes CHANGELOG.md relative to workspace root)
  # - sandbox branch has the same name as the current branch, because semantic-release takes the branch from GITHUB_REF
  # - no GH_TOKEN and release-gh: false, so 'git push' goes to the sandbox 'origin'
  E2E-Versioning:
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ github.ref_name }}
      ORIGIN: ${{ github.workspace }}/../origin.git
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: action
          persist-credentials: false

      - name: Setup sandbox repo
        run: |
          git init -q --bare -b "$BRANCH" "$ORIGIN"
          git init -q -b "$BRANCH"
          echo 'action/' >> .git/info/exclude
          git config user.name "Test User"
          git config user.email "test@example.com"
          git remote add origin "file://$(realpath "$ORIGIN")"
          echo '{ "name": "sandbox", "version": "0.0.0" }' > package.json
          git add package.json
          git commit -q -m "chore: init"


      - name: Test 1. Setup feat commit
        run: |
          echo 'feature' > feature.txt
          git add feature.txt
          git commit -q -m "feat: first feature"
          git push -q origin "$BRANCH"

      - name: Test 1. Should release 1.0.0 with floating tags on first feat commit
        id: test1
        uses: ./action
        with:
          release-gh: false
          release-branches: '["${{ github.ref_name }}"]'
          summary: '' # do not print "Released v1.0.0" in this workflow's summary

      - name: Test 1. Verify version, tags, release commit, CHANGELOG.md and package.json
        env:
          VERSION: ${{ steps.test1.outputs.version }}
          GIT_TAG: ${{ steps.test1.outputs.git-tag }}
        run: |
          set -x
          [[ "$VERSION" == "1.0.0" ]]
          [[ "$GIT_TAG" == "v1.0.0" ]]
          [[ "$(git -C "$ORIGIN" tag | sort | xargs)" == "latest v1 v1.0 v1.0.0" ]]
          [[ "$(git -C "$ORIGIN" log -1 --format=%s "$BRANCH")" == "Release version v1.0.0 [skip ci]" ]]
          [[ "$(git -C "$ORIGIN" rev-parse v1.0.0)" == "$(git -C "$ORIGIN" rev-parse "$BRANCH")" ]]
          [[ "$(git -C "$ORIGIN" show "$BRANCH:package.json" | jq -r .version)" == "1.0.0" ]]
          git -C "$ORIGIN" show "$BRANCH:CHANGELOG.md" | grep -q '^## 1.0.0'
          git -C "$ORIGIN" show "$BRANCH:CHANGELOG.md" | grep -q 'first feature'


      - name: Test 2. Setup fix commit
        run: |
          echo 'fix' > fix.txt
          git add fix.txt
          git commit -q -m "fix: first fix"
          git push -q origin "$BRANCH"

      - name: Test 2. Should release patch 1.0.1 and move floating tags on fix commit
        id: test2
        uses: ./action
        with:
          release-gh: false
          release-branches: '["${{ github.ref_name }}"]'
          summary: ''

      - name: Test 2. Verify version and floating tags
        env:
          VERSION: ${{ steps.test2.outputs.version }}
        run: |
          set -x
          [[ "$VERSION" == "1.0.1" ]]
          head=$(git -C "$ORIGIN" rev-parse "$BRANCH")
          for tag in v1.0.1 v1.0 v1 latest; do
            [[ "$(git -C "$ORIGIN" rev-parse "$tag")" == "$head" ]]
          done
          [[ "$(git -C "$ORIGIN" rev-parse v1.0.0)" != "$head" ]]


      - name: Test 3. Setup fix commit
        run: |
          echo 'fix' > fix2.txt
          git add fix2.txt
          git commit -q -m "fix: second fix"
          git push -q origin "$BRANCH"

      - name: Test 3. Should not update CHANGELOG.md if changelog-file is empty
        id: test3
        uses: ./action
        with:
          release-gh: false
          release-branches: '["${{ github.ref_name }}"]'
          summary: ''
          changelog-file: ''

      - name: Test 3. Verify v1.0.2 is released and CHANGELOG.md is unchanged
        env:
          VERSION: ${{ steps.test3.outputs.version }}
        run: |
          set -x
          [[ "$VERSION" == "1.0.2" ]]
          [[ "$(git -C "$ORIGIN" rev-parse v1.0.2)" == "$(git -C "$ORIGIN" rev-parse "$BRANCH")" ]]
          git -C "$ORIGIN" diff --quiet v1.0.1 "$BRANCH" -- CHANGELOG.md


      # dev-release doesn't generate a version and doesn't push to git, it only publishes artifacts (none here)
      - name: Test 4. Should use branch name as version and push nothing if dev-release is true
        id: test4
        uses: ./action
        with:
          dev-release: true
          dev-branch-prefix: '' # run on any branch
          npm-publish: true # would fail w/o npm credentials if not skipped for dev-release
          # GH_TOKEN is not needed even though release-gh is true (default)

      - name: Test 4. Verify version and nothing is pushed or changed
        env:
          VERSION: ${{ steps.test4.outputs.version }}
        run: |
          set -x
          [[ "$VERSION" == "${BRANCH//\//-}" ]] # feature/abc -> feature-abc
          [[ "$(git -C "$ORIGIN" tag | sort | xargs)" == "latest v1 v1.0 v1.0.0 v1.0.1 v1.0.2" ]]
          [[ "$(git -C "$ORIGIN" rev-parse v1.0.2)" == "$(git -C "$ORIGIN" rev-parse "$BRANCH")" ]]
          git diff --quiet # package.json is not updated


  # Same as 'E2E-Versioning', but with all manifest files (package.json, pom.xml, pyproject.toml, uv.lock):
  # tag-format (e.g. 'v' in 'v1.0.0') applies only to git tags, manifests get a bare version '1.0.0'
  E2E-Manifests:
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ github.ref_name }}
      ORIGIN: ${{ github.workspace }}/../origin.git
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: action
          persist-credentials: false

      - name: Setup sandbox repo with package.json, pom.xml, pyproject.toml and uv.lock
        run: |
          git init -q --bare -b "$BRANCH" "$ORIGIN"
          git init -q -b "$BRANCH"
          echo 'action/' >> .git/info/exclude
          git config user.name "Test User"
          git config user.email "test@example.com"
          git remote add origin "file://$(realpath "$ORIGIN")"
          echo '{ "name": "sandbox", "version": "0.0.0" }' > package.json
          cat > pom.xml <<'POM'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0">
              <modelVersion>4.0.0</modelVersion>
              <groupId>com.example</groupId>
              <artifactId>sandbox</artifactId>
              <version>0.0.0</version>
              <packaging>pom</packaging>
          </project>
          POM
          cat > pyproject.toml <<'TOML'
          [project]
          name = "sandbox"
          version = "0.0.0"
          requires-python = ">=3.9"
          TOML
          cat > uv.lock <<'LOCK'
          version = 1
          revision = 3
          requires-python = ">=3.9"

          [[package]]
          name = "sandbox"
          version = "0.0.0"
          source = { virtual = "." }
          LOCK
          git add package.json pom.xml pyproject.toml uv.lock
          git commit -q -m "chore: init"


      - name: Test 1. Setup feat commit
        run: |
          echo 'feature' > feature.txt
          git add feature.txt
          git commit -q -m "feat: first feature"
          git push -q origin "$BRANCH"

      - name: Test 1. Should update version in package.json, pom.xml, pyproject.toml and uv.lock without 'v' of default tag-format
        id: test1
        uses: ./action
        with:
          release-gh: false
          release-branches: '["${{ github.ref_name }}"]'
          summary: ''

      - name: Test 1. Verify tags, outputs and versions in manifests
        env:
          VERSION: ${{ steps.test1.outputs.version }}
          GIT_TAG: ${{ steps.test1.outputs.git-tag }}
        run: |
          set -x
          [[ "$VERSION" == "1.0.0" ]]
          [[ "$GIT_TAG" == "v1.0.0" ]]
          [[ "$(git -C "$ORIGIN" tag | sort | xargs)" == "latest v1 v1.0 v1.0.0" ]]
          [[ "$(git -C "$ORIGIN" show "$BRANCH:package.json" | jq -r .version)" == "1.0.0" ]]
          git -C "$ORIGIN" show "$BRANCH:pom.xml" | grep -q '<version>1.0.0</version>'
          git -C "$ORIGIN" show "$BRANCH:pyproject.toml" | grep -q '^version = "1.0.0"$'
          git -C "$ORIGIN" show "$BRANCH:uv.lock" | grep -A1 '^name = "sandbox"$' | grep -q '^version = "1.0.0"$'


      - name: Test 2. Setup fix commit
        run: |
          echo 'fix' > fix.txt
          git add fix.txt
          git commit -q -m "fix: first fix"
          git push -q origin "$BRANCH"

      # explicit version is bare, tag-format applies only to the git tag
      - name: Test 2. Should apply custom tag-format to explicit version only in git tag
        id: test2
        uses: ./action
        with:
          release-gh: false
          release-branches: '["${{ github.ref_name }}"]'
          summary: ''
          tag-format: 'release-${version}'
          version: 2.0.0

      - name: Test 2. Verify outputs and versions in manifests
        env:
          VERSION: ${{ steps.test2.outputs.version }}
          GIT_TAG: ${{ steps.test2.outputs.git-tag }}
        run: |
          set -x
          [[ "$VERSION" == "2.0.0" ]]
          [[ "$GIT_TAG" == "release-2.0.0" ]]
          [[ "$(git -C "$ORIGIN" rev-parse release-2.0.0)" == "$(git -C "$ORIGIN" rev-parse "$BRANCH")" ]]
          [[ "$(git -C "$ORIGIN" show "$BRANCH:package.json" | jq -r .version)" == "2.0.0" ]]
          git -C "$ORIGIN" show "$BRANCH:pom.xml" | grep -q '<version>2.0.0</version>'
          git -C "$ORIGIN" show "$BRANCH:pyproject.toml" | grep -q '^version = "2.0.0"$'
          git -C "$ORIGIN" show "$BRANCH:uv.lock" | grep -A1 '^name = "sandbox"$' | grep -q '^version = "2.0.0"$'

  # Prerelease branch: version gets a prerelease suffix (v1.0.0-alpha.1),
  # and the channel is saved in git notes, so the next prerelease continues the sequence (alpha.2, alpha.3)
  # - semantic-release requires at least one regular release branch, so the sandbox also has 'e2e-main' branch
  E2E-Prerelease:
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ github.ref_name }}
      ORIGIN: ${{ github.workspace }}/../origin.git
      RELEASE_BRANCHES: '["e2e-main", {"name": "${{ github.ref_name }}", "prerelease": "alpha", "channel": "beta"}]'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: action
          persist-credentials: false

      - name: Setup sandbox repo with 'e2e-main' release branch
        run: |
          git init -q --bare -b "$BRANCH" "$ORIGIN"
          git init -q -b "$BRANCH"
          echo 'action/' >> .git/info/exclude
          git config user.name "Test User"
          git config user.email "test@example.com"
          git remote add origin "file://$(realpath "$ORIGIN")"
          echo '{ "name": "sandbox", "version": "0.0.0" }' > package.json
          git add package.json
          git commit -q -m "chore: init"
          git push -q origin "HEAD:e2e-main"


      - name: Test 1. Setup feat commit
        run: |
          echo 'feature' > feature.txt
          git add feature.txt
          git commit -q -m "feat: first feature"
          git push -q origin "$BRANCH"

      - name: Test 1. Should release prerelease with custom suffix and channel
        id: test1
        uses: ./action
        with:
          release-gh: false
          release-branches: ${{ env.RELEASE_BRANCHES }}
          summary: ''

      - name: Test 1. Verify version, tags, git notes and package.json
        env:
          VERSION: ${{ steps.test1.outputs.version }}
        run: |
          set -x
          [[ "$VERSION" == "1.0.0-alpha.1" ]]
          [[ "$(git -C "$ORIGIN" tag | sort | xargs)" == "beta v1.0.0-alpha.1" ]]
          head=$(git -C "$ORIGIN" rev-parse "$BRANCH")
          [[ "$(git -C "$ORIGIN" rev-parse v1.0.0-alpha.1)" == "$head" ]]
          [[ "$(git -C "$ORIGIN" rev-parse beta)" == "$head" ]]
          git -C "$ORIGIN" notes --ref semantic-release show "$head" | grep -q '"beta"'
          [[ "$(git -C "$ORIGIN" show "$BRANCH:package.json" | jq -r .version)" == "1.0.0-alpha.1" ]]


      # delete local git notes to simulate a fresh checkout: the channel must come from git notes pushed to origin
      - name: Test 2. Setup fix commit and delete local git notes
        run: |
          git update-ref -d refs/notes/semantic-release
          echo 'fix' > fix.txt
          git add fix.txt
          git commit -q -m "fix: first fix"
          git push -q origin "$BRANCH"

      - name: Test 2. Should continue prerelease sequence
        id: test2
        uses: ./action
        with:
          release-gh: false
          release-branches: ${{ env.RELEASE_BRANCHES }}
          summary: ''

      - name: Test 2. Verify version and channel tag is moved
        env:
          VERSION: ${{ steps.test2.outputs.version }}
        run: |
          set -x
          [[ "$VERSION" == "1.0.0-alpha.2" ]]
          head=$(git -C "$ORIGIN" rev-parse "$BRANCH")
          [[ "$(git -C "$ORIGIN" rev-parse v1.0.0-alpha.2)" == "$head" ]]
          [[ "$(git -C "$ORIGIN" rev-parse beta)" == "$head" ]]


      - name: Test 3. Setup commit without conventional commit type
        run: |
          echo 'docs' > README.md
          git add README.md
          git commit -q -m "update readme"
          git push -q origin "$BRANCH"

      - name: Test 3. Should bump prerelease if version-bump is default-patch
        id: test3
        uses: ./action
        with:
          release-gh: false
          release-branches: ${{ env.RELEASE_BRANCHES }}
          summary: ''
          version-bump: default-patch

      - name: Test 3. Verify version
        env:
          VERSION: ${{ steps.test3.outputs.version }}
        run: |
          set -x
          [[ "$VERSION" == "1.0.0-alpha.3" ]]
          [[ "$(git -C "$ORIGIN" rev-parse v1.0.0-alpha.3)" == "$(git -C "$ORIGIN" rev-parse "$BRANCH")" ]]

  # Release commit and push (not version generation):
  # - pre-publish-script changes go into the release commit
  # - release commit and tags are pushed atomically
  E2E-Release-Commit:
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ github.ref_name }}
      ORIGIN: ${{ github.workspace }}/../origin.git
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: action
          persist-credentials: false

      - name: Setup sandbox repo
        run: |
          git init -q --bare -b "$BRANCH" "$ORIGIN"
          git init -q -b "$BRANCH"
          echo 'action/' >> .git/info/exclude
          git config user.name "Test User"
          git config user.email "test@example.com"
          git remote add origin "file://$(realpath "$ORIGIN")"
          echo '{ "name": "sandbox", "version": "0.0.0" }' > package.json
          git add package.json
          git commit -q -m "chore: init"


      # release commit stages only changes in tracked files (git add -u): to include a new file, pre-publish-script must 'git add' it
      - name: Test 1. Setup fix commit with tracked version.txt
        run: |
          echo '0.0.0' > version.txt
          git add version.txt
          git commit -q -m "fix: add version.txt"
          git push -q origin "$BRANCH"

      - name: Test 1. Should run pre-publish-script with $version (bare)
        id: test1
        uses: ./action
        with:
          release-gh: false
          release-branches: '["${{ github.ref_name }}"]'
          summary: ''
          pre-publish-script: echo "$version" > version.txt

      - name: Test 1. Verify version.txt is updated in release commit
        run: |
          set -x
          [[ "$(git -C "$ORIGIN" show "$BRANCH:version.txt")" == "1.0.0" ]]
          [[ "$(git -C "$ORIGIN" rev-parse v1.0.0)" == "$(git -C "$ORIGIN" rev-parse "$BRANCH")" ]]


      - name: Test 2. Setup fix commit
        run: |
          echo 'fix' > fix2.txt
          git add fix2.txt
          git commit -q -m "fix: second fix"
          git push -q origin "$BRANCH"

      - name: Test 2. Should include new file in release commit if pre-publish-script adds it to git
        id: test2
        uses: ./action
        with:
          release-gh: false
          release-branches: '["${{ github.ref_name }}"]'
          summary: ''
          pre-publish-script: echo "$git_tag" > build-info.txt && git add build-info.txt

      - name: Test 2. Verify build-info.txt is in release commit
        run: |
          set -x
          [[ "$(git -C "$ORIGIN" show "$BRANCH:build-info.txt")" == "v1.0.1" ]] # $git_tag
          [[ "$(git -C "$ORIGIN" rev-parse v1.0.1)" == "$(git -C "$ORIGIN" rev-parse "$BRANCH")" ]]


      - name: Test 3. Setup fix commit
        run: |
          echo 'fix' > fix3.txt
          git add fix3.txt
          git commit -q -m "fix: third fix"
          git push -q origin "$BRANCH"

      - name: Test 3. Should not include new file in release commit if pre-publish-script doesn't add it to git
        id: test3
        uses: ./action
        with:
          release-gh: false
          release-branches: '["${{ github.ref_name }}"]'
          summary: ''
          pre-publish-script: echo "$version" > not-added.txt

      - name: Test 3. Verify v1.0.2 is released without not-added.txt
        run: |
          set -x
          [[ "$(git -C "$ORIGIN" rev-parse v1.0.2)" == "$(git -C "$ORIGIN" rev-parse "$BRANCH")" ]]
          [[ "$(cat not-added.txt)" == "1.0.2" ]] # script did run
          if git -C "$ORIGIN" cat-file -e "$BRANCH:not-added.txt"; then
            echo "not-added.txt must not be in release commit"
            exit 1
          fi


      # someone pushed to the branch while this release was running:
      # release-gen still generates a version, but 'git push --atomic' must reject both the release commit and tags
      - name: Test 4. Setup commit in origin that is not in local branch
        run: |
          git clone -q "file://$(realpath "$ORIGIN")" ../other
          git -C ../other -c user.name=Other -c user.email=other@example.com commit -q --allow-empty -m "fix: concurrent fix"
          git -C ../other push -q origin "$BRANCH"
          echo 'fix' > fix4.txt
          git add fix4.txt
          git commit -q -m "fix: local fix"

      - name: Test 4. Should fail if origin branch has commits that are not in local branch
        id: test4
        continue-on-error: true
        uses: ./action
        with:
          release-gh: false
          release-branches: '["${{ github.ref_name }}"]'
          summary: ''

      - name: Test 4. Verify it failed
        if: steps.test4.outcome != 'failure'
        run: |
          echo "Expected failure, got ${{ steps.test4.outcome }}"
          exit 1

      - name: Test 4. Verify nothing is pushed
        run: |
          set -x
          [[ "$(git -C "$ORIGIN" log -1 --format=%s "$BRANCH")" == "fix: concurrent fix" ]]
          [[ -z "$(git -C "$ORIGIN" tag -l 'v1.0.3')" ]]

  Release:
    if: github.ref == 'refs/heads/main'
    needs: [ Input-Validation, E2E-Versioning, E2E-Manifests, E2E-Prerelease, E2E-Release-Commit ]
    runs-on: ubuntu-slim
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # released with the previous published version, not with the code being tested
      - name: Release
        uses: agilecustoms/release@v5
        env:
          GH_TOKEN: ${{ secrets.GH_PUBLIC_RELEASES_TOKEN }}
